name: CI

on:
  push:
    branches: [main, feature/backend]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: assetlog
          POSTGRES_PASSWORD: assetlog
          POSTGRES_DB: assetlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetlog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://assetlog:assetlog@localhost:5432/assetlog
      SQLX_OFFLINE: "true"
      RUST_BACKTRACE: "1"

    defaults:
      run:
        working-directory: asset-log

    steps:
      - uses: actions/checkout@v5

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: asset-log

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked

      - name: Run migrations
        run: cargo sqlx migrate run

      - name: Check .sqlx is up to date
        env:
          SQLX_OFFLINE: "false"
        run: cargo sqlx prepare --check -- --all-targets

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Check generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build