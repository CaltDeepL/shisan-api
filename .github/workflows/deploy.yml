name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Deploy backend
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.target == 'all' || inputs.target == 'backend'))

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render backend deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL が未設定です"
            exit 1
          fi

          curl -fsS -X POST "$HOOK" > /dev/null

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Backend deploy triggered for ${{ github.event.workflow_run.head_sha }}"
          else
            echo "Backend deploy triggered manually"
          fi

  frontend:
    name: Deploy frontend
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.target == 'all' || inputs.target == 'frontend'))

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render frontend deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_WEB が未設定です"
            exit 1
          fi

          curl -fsS -X POST "$HOOK" > /dev/null

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Frontend deploy triggered for ${{ github.event.workflow_run.head_sha }}"
          else
            echo "Frontend deploy triggered manually"
          fi